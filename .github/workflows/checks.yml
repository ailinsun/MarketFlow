name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The same command a reader runs locally. CI must not have its own universe of
  # checks: if `make verify` passes here and fails on a clean checkout, the badge
  # is lying.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # On a pull_request event the default ref is a merge commit GitHub
          # synthesises for the run. It is not repository history, it never lands on
          # any branch, and its author metadata is copied from the account profile
          # rather than from anything in the repository — so the publication gate was
          # scanning a commit the repository cannot author or control. Check out the
          # branch head, which is exactly the set of commits this release adds.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # No install step: the core is standard library only, and a CI run that
      # needed pip would have quietly stopped proving that.
      - run: make verify
      - run: make history
      - run: make demo

  # The signing layer is an opt-in install, so its suites run in their own job.
  # `make verify` reports them as skipped rather than passed when absent. Only the
  # install may soft-fail (the venue SDK installs from a pinned git commit). When
  # it does, the suites below are skipped and the run says so in a warning and in
  # the job summary; when it succeeds, every suite is a hard failure.
  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - id: install
        continue-on-error: true
        run: pip install -r requirements-signing.txt
      - if: steps.install.outcome != 'success'
        run: |
          echo "::warning::signing dependencies failed to install; signing suites SKIPPED, not passed"
          echo "Signing suites SKIPPED: dependency install failed. This run proves nothing about the signing layer." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.install.outcome == 'success'
        run: python3 -B -m marketflow.guardian.selftest
      - if: steps.install.outcome == 'success'
        run: python3 -B -m unittest discover -s tests -t .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # An independent second layer. The publication gate matches patterns it was
      # told about; a secret scanner catches shapes nobody thought to list. The
      # binary is pinned by version and checksum and scans every reachable commit,
      # not only the commits of this push, and its report is kept with the run.
      - name: gitleaks (pinned binary, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
          ./gitleaks git --redact --no-banner --exit-code 1 --report-path gitleaks-report.json .
          python3 -c "import json; print('gitleaks findings:', len(json.load(open('gitleaks-report.json'))))"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error
